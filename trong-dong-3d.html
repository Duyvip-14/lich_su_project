<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trống đồng 3D – Demo</title>
<style>
:root{--bg:#e9e8dc;--ink:#2a2d26;--red:#7f2a22;--mute:#6b6a5c;--line:#cfcdb9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e9e8dc}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;min-height:100vh}
.eyebrow{color:var(--red);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px}
h1{font:600 clamp(34px,5vw,56px)/1.12 Georgia,"Times New Roman",serif;margin:0 0 20px}
p{color:var(--mute);line-height:1.6;margin:0 0 14px}
.small{font-size:13px}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;justify-self:center}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
button{background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hint{text-align:center;font-size:13px;color:var(--mute);margin-top:6px}
.err{color:var(--red);padding:20px;text-align:center}
@media (max-width:760px){.wrap{grid-template-columns:1fr;padding:28px 18px}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="eyebrow">Chạm vào di sản</p>
    <h1>Một mặt trống. Cả một nền văn hóa.</h1>
    <p>Kéo để xoay quanh trống, cuộn hoặc chụm hai ngón để phóng to, thu nhỏ. Mô hình lấy cảm hứng từ hoa văn Đông Sơn.</p>
    <p class="small">Mô hình cách điệu để trải nghiệm tương tác, không phải bản số hóa hiện vật khảo cổ.</p>
  </div>
  <div>
    <div class="stage"><canvas id="c" aria-label="Mô hình trống đồng 3D, kéo để xoay" role="img"></canvas></div>
    <div class="ctl"><button id="spin" type="button">Tạm dừng xoay</button><button id="reset" type="button">Đặt lại góc nhìn ↺</button></div>
    <div class="hint">Kéo để xoay · Cuộn để thu phóng</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'||!THREE.OrbitControls){
  document.querySelector('.stage').innerHTML='<div class="err">Không tải được thư viện 3D.</div>';return;
}
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.1,50);
const HOME=new THREE.Vector3(3.2,2.6,3.6);
camera.position.copy(HOME);

// ánh sáng
scene.add(new THREE.HemisphereLight(0xfff2d6,0x3a2a14,.9));
const key=new THREE.DirectionalLight(0xfff0cf,1.1);key.position.set(3,5,2);scene.add(key);
const rim=new THREE.DirectionalLight(0xffc27a,.5);rim.position.set(-4,2,-3);scene.add(rim);

// vật liệu đồng
const bronze=new THREE.MeshStandardMaterial({color:0x9c7230,metalness:.35,roughness:.5});
const bronzeDark=new THREE.MeshStandardMaterial({color:0x7a5622,metalness:.35,roughness:.6,side:THREE.DoubleSide});

// hoa văn mặt trống vẽ bằng canvas 2D
function makeFace(){
  const S=1024,c=S/2,k=document.createElement('canvas');k.width=k.height=S;
  const g=k.getContext('2d');
  const grd=g.createRadialGradient(c,c,20,c,c,c);
  grd.addColorStop(0,'#c0904a');grd.addColorStop(1,'#946a2c');
  g.fillStyle=grd;g.fillRect(0,0,S,S);
  const dark='#4a3112',light='#e0bd78';
  g.lineCap='round';g.lineJoin='round';
  const ring=(r,col,w)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(c,c,r,0,Math.PI*2);g.stroke();};
  const ticks=(r1,r2,n,col,w,off=0)=>{g.strokeStyle=col;g.lineWidth=w;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+off;g.beginPath();g.moveTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);g.lineTo(c+Math.cos(a)*r2,c+Math.sin(a)*r2);g.stroke();}};
  // ngôi sao ở tâm
  g.fillStyle=dark;
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2-Math.PI/2,w=.11;
    g.beginPath();
    g.moveTo(c+Math.cos(a-w)*34,c+Math.sin(a-w)*34);
    g.lineTo(c+Math.cos(a)*128,c+Math.sin(a)*128);
    g.lineTo(c+Math.cos(a+w)*34,c+Math.sin(a+w)*34);
    g.closePath();g.fill();
  }
  g.fillStyle=light;g.beginPath();g.arc(c,c,26,0,Math.PI*2);g.fill();
  ring(26,dark,5);
  ring(142,dark,5);ring(152,light,3);
  ticks(160,186,84,dark,4);
  ring(196,dark,4);
  g.fillStyle=dark;for(let i=0;i<48;i++){const a=i/48*Math.PI*2;g.beginPath();g.arc(c+Math.cos(a)*214,c+Math.sin(a)*214,6,0,Math.PI*2);g.fill();}
  ring(232,dark,4);ring(238,light,3);
  // dải zigzag
  g.strokeStyle=dark;g.lineWidth=4;g.beginPath();
  const N=72;for(let i=0;i<=N;i++){const a=i/N*Math.PI*2,r=i%2?252:274;const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();
  ring(288,dark,4);
  ticks(298,330,120,dark,4);
  ticks(298,314,120,light,3,Math.PI/120);
  ring(340,dark,5);ring(348,light,3);
  // dải tam giác
  g.fillStyle=dark;
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,w=.045;
    g.beginPath();g.moveTo(c+Math.cos(a-w)*358,c+Math.sin(a-w)*358);g.lineTo(c+Math.cos(a)*392,c+Math.sin(a)*392);g.lineTo(c+Math.cos(a+w)*358,c+Math.sin(a+w)*358);g.closePath();g.fill();}
  ring(402,dark,4);
  ticks(412,444,180,dark,3);
  ring(456,dark,5);ring(466,light,3);ring(484,dark,6);
  const t=new THREE.CanvasTexture(k);
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
const faceMat=new THREE.MeshStandardMaterial({map:makeFace(),metalness:.3,roughness:.5});

const drum=new THREE.Group();

// thân trống: đường viền (bán kính, độ cao) quay quanh trục
const prof=[[.90,0],[.86,.08],[.76,.2],[.68,.33],[.66,.42],[.71,.54],[.79,.67],[.82,.77],[.80,.85],[.84,.91]]
  .map(p=>new THREE.Vector2(p[0],p[1]));
const curve=new THREE.SplineCurve(prof);
const body=new THREE.Mesh(new THREE.LatheGeometry(curve.getPoints(70),96),bronzeDark);
drum.add(body);

// mặt trống (tympan) nhô ra rộng hơn thân
const face=new THREE.Mesh(new THREE.CylinderGeometry(1.0,.97,.1,96,1),[bronze,faceMat,bronze]);
face.position.y=.96;
drum.add(face);
// gờ dưới mặt trống
const lip=new THREE.Mesh(new THREE.CylinderGeometry(.97,.86,.05,96,1,true),bronzeDark);
lip.position.y=.905;drum.add(lip);

// bốn quai trống
for(let i=0;i<4;i++){
  const a=i/4*Math.PI*2+Math.PI/4;
  const g=new THREE.TorusGeometry(.1,.02,10,24,Math.PI);
  g.rotateZ(-Math.PI/2);
  const m=new THREE.Mesh(g,bronze);
  m.position.set(Math.cos(a)*.79,.64,Math.sin(a)*.79);
  m.rotation.y=-a;
  drum.add(m);
}
drum.position.y=-.5;
scene.add(drum);

// điều khiển
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.enablePan=false;
controls.minDistance=3;controls.maxDistance=8;
controls.minPolarAngle=.15;controls.maxPolarAngle=1.5;
controls.autoRotate=true;controls.autoRotateSpeed=1.2;
controls.target.set(0,0,0);

const spinBtn=document.getElementById('spin');
spinBtn.onclick=()=>{controls.autoRotate=!controls.autoRotate;spinBtn.textContent=controls.autoRotate?'Tạm dừng xoay':'Tiếp tục xoay';};
document.getElementById('reset').onclick=()=>{camera.position.copy(HOME);controls.target.set(0,0,0);controls.update();};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){controls.autoRotate=false;spinBtn.textContent='Tiếp tục xoay';}

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width,r.height,false);
  camera.aspect=r.width/r.height;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);resize();

(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
})();
</script>
</body>
</html>
