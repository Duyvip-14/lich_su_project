services:
  mysql:
    image: mysql:8.0
    container_name: lich-su-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: lich_su_viet_nam
      MYSQL_USER: lichsu_user
      MYSQL_PASSWORD: lichsu_password123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
